name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Build
        run: make build

  # Production deploys live in a separate private repository. A push to master
  # only tells it which commit to ship. Forks have no DEPLOY_REPO, so this skips.
  deploy:
    name: Trigger deploy
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && vars.DEPLOY_REPO != ''
    steps:
      - name: Dispatch to the deploy repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh api "repos/${{ vars.DEPLOY_REPO }}/dispatches" \
            -f event_type=deploy \
            -f "client_payload[sha]=${{ github.sha }}"
