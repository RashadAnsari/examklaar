name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

      - name: Build
        run: make build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
  
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
  
      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: examklaar:${{ github.sha }}
          cache-from: type=gha
          build-args: |
            NODE_ENV=production
            GIT_SHA=${{ github.sha }}
            ANALYTICS_GA_MEASUREMENT_ID=${{ secrets.ANALYTICS_GA_MEASUREMENT_ID }}
  
      - name: Docker Save
        if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != ''
        run: docker save examklaar:${{ github.sha }} > /tmp/docker-image.tar
  
      - name: Connect to Tailscale
        if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:examklaarci

      - name: Run Playbook
        if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != ''
        uses: dawidd6/action-ansible-playbook@v9
        with:
          directory: deploy
          playbook: app.yaml
          configuration: |
            [defaults]
            inventory = inventory.yaml
            host_key_checking = False
          inventory: |
            [examklaar]
            ${{ vars.DEPLOY_HOST }} ansible_user=root
          options: |
            -e "docker_image_tag=${{ github.sha }}"
            -e "docker_image_path=/tmp/docker-image.tar"
            -e "google_api_key=${{ secrets.GOOGLE_API_KEY }}"
            -e "postgres_password=${{ secrets.POSTGRES_PASSWORD }}"
            -e "better_auth_secret=${{ secrets.BETTER_AUTH_SECRET }}"
            -e "better_auth_url=${{ secrets.BETTER_AUTH_URL }}"
            -e "smtp_host=${{ secrets.SMTP_HOST }}"
            -e "smtp_port=${{ secrets.SMTP_PORT }}"
            -e "smtp_user=${{ secrets.SMTP_USER }}"
            -e "smtp_password=${{ secrets.SMTP_PASSWORD }}"
            -e "smtp_from_email=${{ secrets.SMTP_FROM_EMAIL }}"
            -e "smtp_from_name=${{ secrets.SMTP_FROM_NAME }}"
            -e "s3_endpoint=${{ secrets.S3_ENDPOINT }}"
            -e "s3_region=${{ secrets.S3_REGION }}"
            -e "s3_access_key_id=${{ secrets.S3_ACCESS_KEY_ID }}"
            -e "s3_secret_access_key=${{ secrets.S3_SECRET_ACCESS_KEY }}"
            -e "s3_bucket_recordings=${{ secrets.S3_BUCKET_RECORDINGS }}"
            -e "exam_assets_base_url=${{ secrets.EXAM_ASSETS_BASE_URL }}"
            -e "analytics_ga_measurement_id=${{ secrets.ANALYTICS_GA_MEASUREMENT_ID }}"
#             -e "payment_provider=${{ secrets.PAYMENT_PROVIDER }}"
#             -e "paddle_api_key=${{ secrets.PADDLE_API_KEY }}"
#             -e "paddle_client_token=${{ secrets.PADDLE_CLIENT_TOKEN }}"
#             -e "paddle_webhook_secret=${{ secrets.PADDLE_WEBHOOK_SECRET }}"
#             -e "paddle_price_id_monthly=${{ secrets.PADDLE_PRICE_ID_MONTHLY }}"
