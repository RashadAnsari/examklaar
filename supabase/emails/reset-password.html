<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; padding: 40px 24px; background: #fafafa;">
  <div style="background: white; border-radius: 16px; padding: 40px; border: 1px solid #e5e7eb;">
    <p style="font-size: 22px; font-weight: 700; color: #1b6b4a; margin: 0 0 24px;">Examklaar</p>
    <h2 style="font-size: 20px; font-weight: 700; color: #111827; margin: 0 0 12px;">Reset your password</h2>
    <p style="font-size: 15px; color: #4b5563; margin: 0 0 28px; line-height: 1.6;">We received a request to reset your password. Click the button below to choose a new one.</p>
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #1b6b4a; color: white; text-decoration: none; font-size: 15px; font-weight: 600; padding: 12px 24px; border-radius: 8px;">
      Reset password
    </a>
    <p style="font-size: 13px; color: #9ca3af; margin: 32px 0 0; line-height: 1.6;">
      If you didn't request a password reset, you can safely ignore this email. Your password will not be changed.
    </p>
  </div>
</div>
